name: governance-cycle

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: governance-cycle
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: git-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - name: Run governance cycle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: node scripts/governance.mjs
      - name: Commit decisions
        # Always persist the audit trail, including abort/error records.
        # Fail-closed: a clean worktree with unpushed commits must still push.
        if: always()
        run: |
          set -e
          git config user.name "aicanonfeed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain decisions)" ]; then
            git add decisions
            if ! git diff --cached --quiet decisions; then
              git commit -m "chore: record governance decisions"
            fi
          fi
          git fetch origin main
          if [ "$(git rev-list --count origin/main..HEAD)" != "0" ]; then
            if ! git merge --ff-only FETCH_HEAD; then
              git pull --rebase origin main
            fi
            git push origin HEAD
          else
            echo "no unpushed decision commits"
          fi
